name: Deploy UAT & Prod - Release

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        required: true
        type: string
      release_version:
        required: true
        type: string
      start_date:
        type: string
      end_date:
        type: string
        

jobs:      
  package-registration:
    runs-on: ubuntu-latest
    steps:
      - name: SN Register Package
        uses: ServiceNow/servicenow-devops-register-package@v7.0.0
        with:
          devops-integration-token: ${{ secrets.SN_TOKEN }}
          instance-url: ${{ secrets.SN_URL }}
          tool-id: ${{ secrets.SN_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: ${{ github.job }}
          artifacts: '[{"name": "jon-devops-open", "version": "${{ inputs.artifact_version }}", "repositoryName": "${{ github.repository }}"}]'
          package-name: 'Demo Package - ${{ github.run_number }}'
      - name: ServiceNow DevOps Change Automation
        uses: ServiceNow/servicenow-devops-change@v7.0.0
        with:
          instance-url: ${{ secrets.SN_URL }}
          devops-integration-token: ${{ secrets.SN_TOKEN }}
          tool-id: ${{ secrets.SN_TOOL_ID }}
          job-name: ${{ github.job }}
          context-github: ${{ toJSON(github) }}
          change-request: '{"attributes":{"software_model":{"name":"${{inputs.release_version}}"}}}'
          deployment-gate: '{"environment":"UAT","jobName":"uat-deploy"}'

  uat-deploy:
    runs-on: ubuntu-latest
    needs: package-registration
    environment: UAT
    steps:
      - name: ServiceNow DevOps Change Automation with dates
        if: inputs.start_date != '' && inputs.end_date != ''
        uses: ServiceNow/servicenow-devops-change@v7.0.0
        with:
          instance-url: ${{ secrets.SN_URL }}
          devops-integration-token: ${{ secrets.SN_TOKEN }}
          tool-id: ${{ secrets.SN_TOOL_ID }}
          job-name: ${{ github.job }}
          context-github: ${{ toJSON(github) }}
          change-request: '{"attributes":{"software_model":"${{inputs.release_version}}","start_date":"${{inputs.start_date}}","end_date":"${{inputs.end_date}}"}}'
          deployment-gate: '{"environment":"Production","jobName":"prod-deploy"}'
      - name: ServiceNow DevOps Change Automation
        if: inputs.start_date == '' || inputs.end_date == ''
        uses: ServiceNow/servicenow-devops-change@v7.0.0
        with:
          instance-url: ${{ secrets.SN_URL }}
          devops-integration-token: ${{ secrets.SN_TOKEN }}
          tool-id: ${{ secrets.SN_TOOL_ID }}
          job-name: ${{ github.job }}
          context-github: ${{ toJSON(github) }}
          change-request: '{"attributes":{"software_model":"${{inputs.release_version}}"}}'
          deployment-gate: '{"environment":"Production","jobName":"prod-deploy"}'

  prod-deploy:
    needs: uat-deploy
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Run a one-line script
        run: |
          echo Deployed!
        
